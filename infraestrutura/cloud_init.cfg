#cloud-config
# Configuração inicial automática aplicada no primeiro boot de cada VM.
# Este arquivo é um template: as variáveis hostname, username e ssh_key
# são substituídas pelo OpenTofu (função templatefile) em main.tf, uma vez
# para cada máquina virtual (devops1 e devops2).

hostname: ${hostname}
fqdn: ${hostname}.datasci.local
manage_etc_hosts: true

users:
  - default
  - name: ${username}
    gecos: DevOps Lab
    groups:
      - adm
      - sudo
    shell: /bin/bash
    sudo:
      - "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ${ssh_key}

# Acesso apenas por chave pública — login por senha desativado
ssh_pwauth: false
disable_root: true

timezone: America/Sao_Paulo

package_update: true

packages:
  - python3
  - python3-pip

# Prova de que o cloud-init foi aplicado (verificar.sh lê este arquivo):
# o arquivo nasce no 1º boot com o que o OpenTofu passou ao template.
write_files:
  - path: /etc/datasci-cloud-init.txt
    owner: root:root
    permissions: "0644"
    content: |
      Provisionada por cloud-init (OpenTofu) - Projeto Integrado Data Science
      host=${hostname} usuario=${username} login_por_senha=desativado

runcmd:
  - |
    echo "cloud-init aplicado em $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /etc/datasci-cloud-init.txt

final_message: "cloud-init concluído em $UPTIME segundos na maquina ${hostname}"
