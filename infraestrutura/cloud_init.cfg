#cloud-config
# Configuração inicial automática aplicada no primeiro boot de cada VM.
# Este arquivo é um template: ${hostname}, ${username} e ${ssh_key} são
# substituídos pelo OpenTofu (função templatefile) em main.tf, uma vez
# para cada máquina virtual (devops1 e devops2).

hostname: ${hostname}
fqdn: ${hostname}.datasci.local
manage_etc_hosts: true

users:
  - default
  - name: ${username}
    gecos: DevOps Lab
    groups:
      - adm
      - sudo
    shell: /bin/bash
    sudo:
      - "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ${ssh_key}

# Acesso apenas por chave pública — login por senha desativado
ssh_pwauth: false
disable_root: true

package_update: true

packages:
  - python3
  - python3-pip

final_message: "cloud-init concluído em $UPTIME segundos na maquina ${hostname}"
